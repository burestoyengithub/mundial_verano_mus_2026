<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mundial Verano Mus 2026</title>

    <link rel="stylesheet" href="css/style.css">


    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

</head>


<body>

<h1>
Mundial Verano Mus 2026
</h1>


<section>

<h2>Añadir jugador</h2>

<input 
    id="nombreJugador"
    placeholder="Nombre del jugador"
>


<button id="btnJugador">
Añadir jugador
</button>


</section>



<section>

<h2>Jugadores</h2>

<ul id="listaJugadores"></ul>

</section>

<h2>Registrar partida</h2>

<div id="partida">

    <h3>Pareja A</h3>

    <select id="jugadorA1">
        <option value="">Seleccionar jugador</option>
    </select>

    <select id="jugadorA2">
        <option value="">Seleccionar jugador</option>
    </select>


    <h3>Pareja B</h3>

    <select id="jugadorB1">
        <option value="">Seleccionar jugador</option>
    </select>

    <select id="jugadorB2">
        <option value="">Seleccionar jugador</option>
    </select>


    <h3>Ganador</h3>

    <label>
        <input type="radio" name="ganador" value="A">
        Pareja A
    </label>


    <label>
        <input type="radio" name="ganador" value="B">
        Pareja B
    </label>


    <br><br>

    <button id="guardarPartida">
        Guardar partida
    </button>

</div>

<script src="js/firebase.js"></script>
<script src="js/script.js"></script>
<script src="js/partidas.js"></script>
</body>


</html>
